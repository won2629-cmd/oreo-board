<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오레오반 학급홈페이지</title>
<style>
  :root{
    --cream:#faf7f2;
    --panel:#ffffff;
    --ink:#2b2420;
    --sub:#8a7d6e;
    --choco:#6b4a2f;
    --choco-dark:#4a3220;
    --line:#e8e0d4;
    --accent:#d98e3f;
    --sidebar-bg:#fdf1e4;
    --sidebar-line:#f0dcc4;
    --pink:#f4a9a0;
    --board:#2f2a28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:120px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-line);
    padding:24px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .sidebar .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
  }
  .sidebar .brand .icon-circle{
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--choco-dark);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sidebar .brand span{
    font-size:12px;
    font-weight:700;
    color:var(--choco-dark);
  }
  .sidebar nav{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .sidebar nav a{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-decoration:none;
  }
  .sidebar nav a .icon-circle{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--pink);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.08);
  }
  .sidebar nav a span{
    font-size:12px;
    font-weight:700;
    color:var(--choco-dark);
  }
  .hero{
    position:relative;
    background:var(--board);
    padding:40px 20px 30px;
    text-align:center;
    overflow:hidden;
  }
  .hero svg{display:block;margin:0 auto;}
  .hero h2{
    margin:14px 0 0;
    font-size:22px;
    color:#fff;
    letter-spacing:-0.01em;
  }
  .hero h2 .sweet{color:var(--pink);}
  .hero p{
    margin:8px 0 0;
    color:#cfc6bd;
    font-size:13px;
  }
  .content{
    flex:1;
    min-width:0;
  }
  @media (max-width:700px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%;
      flex-direction:row;
      justify-content:center;
      padding:14px 12px;
    }
    .sidebar .brand{margin-bottom:0;}
    .sidebar nav{flex-direction:row;}
    .hero{padding:28px 16px 22px;}
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:24px 16px 80px;
  }
  .write-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:28px;
  }
  .write-box input[type="text"]{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    margin-bottom:10px;
    font-family:inherit;
  }
  .write-box textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:15px;
    min-height:90px;
    resize:vertical;
    font-family:inherit;
    margin-bottom:12px;
  }
  .write-box button{
    background:var(--choco);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    float:right;
  }
  .write-box button:hover{background:var(--choco-dark);}
  .write-box::after{content:"";display:block;clear:both;}

  .post{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }
  .post-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .post-name{
    font-weight:700;
    color:var(--choco-dark);
    font-size:15px;
  }
  .post-time{
    font-size:12px;
    color:var(--sub);
  }
  .post-actions{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .delete-btn{
    background:none;
    border:none;
    color:var(--sub);
    font-size:12px;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
  }
  .delete-btn:hover{color:#b3432f;}
  .post-content{
    font-size:15px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:14px;
  }
  .comments{
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .comment{
    display:flex;
    gap:6px;
    font-size:13px;
    margin-bottom:6px;
    line-height:1.5;
  }
  .comment-name{
    font-weight:700;
    color:var(--choco);
    flex-shrink:0;
  }
  .comment-content{
    color:var(--ink);
    word-break:break-word;
  }
  .comment-form{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .comment-form input[type="text"]{
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
    font-size:12px;
    font-family:inherit;
  }
  .comment-form input.c-name{width:64px;flex-shrink:0;}
  .comment-form input.c-content{flex:1;}
  .comment-form button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .comment-form button:hover{opacity:0.9;}
  .empty{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    padding:40px 0;
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="icon-circle">
        <svg width="32" height="32" viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="15" fill="#5a3d26"/>
          <circle cx="16" cy="16" r="10.5" fill="#f4e3c8"/>
          <circle cx="11" cy="13" r="1.4" fill="#5a3d26"/>
          <circle cx="21" cy="13" r="1.4" fill="#5a3d26"/>
          <path d="M12 19 Q16 22 20 19" stroke="#5a3d26" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <span>오레오</span>
    </div>
    <nav>
      <a href="#">
        <div class="icon-circle">
          <svg width="26" height="26" viewBox="0 0 26 26">
            <rect x="4" y="4" width="18" height="18" rx="4" fill="#fff" opacity="0.9"/>
            <rect x="7" y="8" width="12" height="2" rx="1" fill="#b3432f"/>
            <rect x="7" y="12.5" width="12" height="2" rx="1" fill="#b3432f"/>
            <rect x="7" y="17" width="8" height="2" rx="1" fill="#b3432f"/>
          </svg>
        </div>
        <span>자유게시판</span>
      </a>
    </nav>
  </aside>

  <div class="content">
    <div class="hero">
      <svg width="220" height="60" viewBox="0 0 220 60" style="position:absolute;top:10px;left:50%;transform:translateX(-50%);opacity:0.5;">
        <circle cx="20" cy="15" r="1.6" fill="#fff"/>
        <circle cx="45" cy="35" r="1" fill="#fff"/>
        <circle cx="180" cy="12" r="1.6" fill="#fff"/>
        <circle cx="200" cy="30" r="1" fill="#fff"/>
        <path d="M65 10 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="var(--pink)"/>
        <path d="M155 40 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="var(--pink)"/>
      </svg>
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="#5a3d26"/>
        <circle cx="60" cy="60" r="38" fill="#f4e3c8"/>
        <circle cx="42" cy="52" r="4.5" fill="#5a3d26"/>
        <circle cx="78" cy="52" r="4.5" fill="#5a3d26"/>
        <circle cx="36" cy="66" r="6" fill="var(--pink)" opacity="0.8"/>
        <circle cx="84" cy="66" r="6" fill="var(--pink)" opacity="0.8"/>
        <path d="M44 70 Q60 82 76 70" stroke="#5a3d26" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <h2>오레오반의 <span class="sweet">달콤한</span> 하루</h2>
      <p>자유게시판에서 이야기를 나눠보세요</p>
    </div>

    <main>
      <div class="write-box">
        <input type="text" id="postName" placeholder="이름 또는 모둠명" maxlength="20">
        <textarea id="postContent" placeholder="여기에 글을 써주세요" maxlength="1000"></textarea>
        <button onclick="submitPost()">올리기</button>
      </div>

      <div id="postList">
        <div class="empty">아직 글이 없어요. 첫 글을 남겨보세요!</div>
      </div>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD7gxnHcRXVrOU2cRLig4dybIkBxuIHyLk",
    authDomain: "oreo55-6fe41.firebaseapp.com",
    databaseURL: "https://oreo55-6fe41-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "oreo55-6fe41",
    storageBucket: "oreo55-6fe41.firebasestorage.app",
    messagingSenderId: "761518669415",
    appId: "1:761518669415:web:0066879dfa420f34349ec2"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const postsRef = db.ref("posts");

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTime(ts){
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
  }

  function submitPost(){
    const nameEl = document.getElementById("postName");
    const contentEl = document.getElementById("postContent");
    const name = nameEl.value.trim();
    const content = contentEl.value.trim();
    if(!name || !content){
      alert("이름과 글 내용을 모두 입력해주세요.");
      return;
    }
    postsRef.push({
      name: name,
      content: content,
      timestamp: Date.now()
    });
    contentEl.value = "";
  }

  const TEACHER_PASSWORD = "3699";

  function deletePost(postId){
    const pw = prompt("삭제하려면 암호를 입력하세요.");
    if(pw === null) return;
    if(pw !== TEACHER_PASSWORD){
      alert("암호가 틀렸습니다.");
      return;
    }
    if(confirm("이 글을 정말 삭제할까요? 되돌릴 수 없습니다.")){
      db.ref(`posts/${postId}`).remove();
    }
  }

  function submitComment(postId, nameInput, contentInput){
    const name = nameInput.value.trim();
    const content = contentInput.value.trim();
    if(!name || !content){
      alert("이름과 댓글 내용을 입력해주세요.");
      return;
    }
    db.ref(`posts/${postId}/comments`).push({
      name: name,
      content: content,
      timestamp: Date.now()
    });
    contentInput.value = "";
  }

  function renderComments(postId, comments){
    let html = "";
    if(comments){
      const list = Object.values(comments).sort((a,b)=>a.timestamp-b.timestamp);
      list.forEach(c=>{
        html += `<div class="comment"><span class="comment-name">${escapeHtml(c.name)}</span><span class="comment-content">${escapeHtml(c.content)}</span></div>`;
      });
    }
    return html;
  }

  postsRef.on("value", (snapshot)=>{
    const data = snapshot.val();
    const listEl = document.getElementById("postList");
    listEl.innerHTML = "";

    if(!data){
      listEl.innerHTML = '<div class="empty">아직 글이 없어요. 첫 글을 남겨보세요!</div>';
      return;
    }

    const posts = Object.entries(data).sort((a,b)=>b[1].timestamp-a[1].timestamp);

    posts.forEach(([postId, post])=>{
      const postEl = document.createElement("div");
      postEl.className = "post";
      postEl.innerHTML = `
        <div class="post-head">
          <span class="post-name">${escapeHtml(post.name)}</span>
          <span class="post-actions">
            <span class="post-time">${formatTime(post.timestamp)}</span>
            <button class="delete-btn">삭제</button>
          </span>
        </div>
        <div class="post-content">${escapeHtml(post.content)}</div>
        <div class="comments">
          <div class="comment-list">${renderComments(postId, post.comments)}</div>
          <div class="comment-form">
            <input type="text" class="c-name" placeholder="이름" maxlength="20">
            <input type="text" class="c-content" placeholder="댓글 달기" maxlength="200">
            <button>등록</button>
          </div>
        </div>
      `;
      const nameInput = postEl.querySelector(".c-name");
      const contentInput = postEl.querySelector(".c-content");
      const btn = postEl.querySelector(".comment-form button");
      btn.onclick = ()=> submitComment(postId, nameInput, contentInput);
      postEl.querySelector(".delete-btn").onclick = ()=> deletePost(postId);
      contentInput.addEventListener("keydown", (e)=>{
        if(e.key === "Enter") submitComment(postId, nameInput, contentInput);
      });
      listEl.appendChild(postEl);
    });
  });
</script>

</body>
</html>
